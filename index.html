<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Data Pendidikan - Dinas Pendidikan Kota Ternate</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }

    /* ===================== LOADING SCREEN ===================== */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, #1e3a8a 0%, #172554 45%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 10;
      overflow: hidden;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #loadingScreen.fade-out {
      opacity: 0;
      transform: scale(1.03);
    }

    /* Blob dekoratif melayang lembut di latar belakang */
    .ls-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
    }
    .ls-blob-1 { width: 340px; height: 340px; background: #3b82f6; top: -80px; left: -60px; animation: ls-float 9s ease-in-out infinite; }
    .ls-blob-2 { width: 300px; height: 300px; background: #6366f1; bottom: -100px; right: -60px; animation: ls-float 11s ease-in-out infinite reverse; }
    .ls-blob-3 { width: 220px; height: 220px; background: #0ea5e9; bottom: 15%; left: 8%; animation: ls-float 7.5s ease-in-out infinite; }
    @keyframes ls-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, -22px) scale(1.06); }
    }

    /* Kartu konten tengah */
    .ls-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px;
      text-align: center;
      animation: ls-rise 0.7s ease both;
    }
    @keyframes ls-rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Ikon lingkaran gradien dengan ring berdenyut */
    .ls-icon-wrap {
      width: 76px; height: 76px;
      margin-bottom: 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, #3b82f6, #4f46e5);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 34px -10px rgba(59, 130, 246, 0.55);
      position: relative;
      animation: ls-bob 3s ease-in-out infinite;
    }
    .ls-icon-wrap::before,
    .ls-icon-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 22px;
      border: 2px solid rgba(147, 197, 253, 0.45);
      animation: ls-pulse-ring 2s ease-out infinite;
    }
    .ls-icon-wrap::after { animation-delay: 0.7s; }
    @keyframes ls-pulse-ring {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    @keyframes ls-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .ls-icon-wrap svg { width: 38px; height: 38px; }

    .ls-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .ls-subtitle {
      font-size: 0.78rem;
      font-weight: 500;
      color: #93c5fd;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .ls-status {
      margin-top: 26px;
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ls-status .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #60a5fa;
      animation: ls-dot 1.2s ease-in-out infinite;
    }
    .ls-status .dot:nth-child(2) { animation-delay: 0.2s; }
    .ls-status .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes ls-dot {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    .ls-bar {
      width: 200px;
      height: 4px;
      margin-top: 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .ls-bar-fill {
      width: 35%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b82f6, #818cf8);
      animation: ls-bar-move 1.3s ease-in-out infinite;
    }
    @keyframes ls-bar-move {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(380%); }
    }

    .ls-footer {
      position: absolute;
      bottom: 22px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.68rem;
      color: rgba(203, 213, 225, 0.55);
      letter-spacing: 0.03em;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="ls-blob ls-blob-1"></div>
    <div class="ls-blob ls-blob-2"></div>
    <div class="ls-blob ls-blob-3"></div>

    <div class="ls-content">
      <div class="ls-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L1 8l11 5 9-4.09V17h2V8L12 3z" fill="#ffffff"/>
          <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" fill="#ffffff" opacity="0.85"/>
        </svg>
      </div>
      <div class="ls-title">Manajemen Data Pendidikan</div>
      <div class="ls-subtitle">Dinas Pendidikan Kota Ternate</div>

      <div class="ls-status">
        <span>Memuat Portal Data Pendidikan</span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>

      <div class="ls-bar"><div class="ls-bar-fill"></div></div>
    </div>

    <div class="ls-footer">Sistem Informasi Pendidikan &middot; Kota Ternate</div>
  </div>

  <!-- PERUBAHAN: ganti URL di bawah ini dengan URL Apps Script Anda sendiri -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyRAJkC5qpfT1RsWXLvcN7PWHDfpTyCHPGnonNXMrzQiMAeRq8qE7qnDxHYEDEdsnKsDQ/exec"
    onload="handleFrameLoaded()"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    function handleFrameLoaded() {
      const ls = document.getElementById('loadingScreen');
      ls.classList.add('fade-out');
      setTimeout(() => { ls.style.display = 'none'; }, 500);
    }

    // PERUBAHAN: kalau ada parameter di URL GitHub Pages ini (misalnya ?t=xxx dari
    // tombol "Buka di Tab Baru"), teruskan parameter yang sama ke dalam iframe.
    (function() {
      const baseSrc = "https://script.google.com/macros/s/AKfycbyRAJkC5qpfT1RsWXLvcN7PWHDfpTyCHPGnonNXMrzQiMAeRq8qE7qnDxHYEDEdsnKsDQ/exec";
      const params = window.location.search; // contoh: "?t=abc123"
      if (params) {
        document.getElementById('appFrame').src = baseSrc + params;
      }
    })();
  </script>

</body>
</html>
