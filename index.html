<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Data Pendidikan - Dinas Pendidikan Kota Ternate</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: #1e3a8a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <p>Memuat Portal Data Pendidikan...</p>
  </div>

  <!-- PERUBAHAN: ganti URL di bawah ini dengan URL Apps Script Anda sendiri -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbx_e1HiyyuXtcDEfJKdyKQ7GBSYKVUTmA2kJ95ZS7RJJNf449X73WSZ4ivxzVjbPZIkIQ/exec"
    onload="document.getElementById('loadingScreen').style.opacity='0'; setTimeout(()=>{document.getElementById('loadingScreen').style.display='none';}, 400);"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    // PERUBAHAN: kalau ada parameter di URL GitHub Pages ini (misalnya ?t=xxx dari
    // tombol "Buka di Tab Baru"), teruskan parameter yang sama ke dalam iframe.
    (function() {
      const baseSrc = "https://script.google.com/macros/s/AKfycbx_e1HiyyuXtcDEfJKdyKQ7GBSYKVUTmA2kJ95ZS7RJJNf449X73WSZ4ivxzVjbPZIkIQ/exec";
      const params = window.location.search; // contoh: "?t=abc123"
      if (params) {
        document.getElementById('appFrame').src = baseSrc + params;
      }
    })();
  </script>

</body>
</html>
